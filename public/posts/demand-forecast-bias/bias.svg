<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">The average hides the costly error</title>
  <desc id="d">Bar chart of 4-week forecast bias. All products together: −1.3%. Launch and mature products, 87% of forecast weeks: −3.9%. Products in their final decline, 13% of forecast weeks: +42%.</desc>
  <defs>
    <style>
      .head { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 2px; fill: #6b6b6b; }
      .label { font-family: Geist, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #1a1a1a; }
      .note { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #6b6b6b; }
      .val { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
    </style>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="40" y="48" class="head">4-WEEK FORECAST BIAS · UNDER − / OVER +</text>

  <!-- zero line at x=300; 1% = 8px -->
  <line x1="300" y1="78" x2="300" y2="352" stroke="#9b9b9b" stroke-width="1.5"/>
  <text x="300" y="372" class="note" text-anchor="middle">0</text>

  <text x="40" y="118" class="label">All products</text>
  <text x="40" y="137" class="note">what one score shows</text>
  <rect x="289.6" y="102" width="10.4" height="30" fill="#9b9b9b"/>
  <text x="312" y="124" class="val">−1.3%</text>

  <text x="40" y="208" class="label">Launch / mature</text>
  <text x="40" y="227" class="note">87% of weeks</text>
  <rect x="268.8" y="192" width="31.2" height="30" fill="#2f6fbf"/>
  <text x="312" y="214" class="val">−3.9%</text>

  <text x="40" y="298" class="label">Final decline</text>
  <text x="40" y="317" class="note">13% of weeks</text>
  <rect x="300" y="282" width="336" height="30" fill="#dd0077"/>
  <text x="648" y="304" class="val" style="fill:#dd0077">+42%</text>
</svg>
