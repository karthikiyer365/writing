<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">One product's life: APP-1021</title>
  <desc id="d">Weekly demand for one apparel product from June 2023 to July 2024. It ramps up after launch to about 60 a week, peaks at 193 in late November, settles around 67 a week through spring 2024, then declines from 20 May 2024 to 8 a week by its last week at the end of July. In three stockout weeks it sold 3, 4 and 2 units while customers wanted 53, 54 and 30.</desc>
