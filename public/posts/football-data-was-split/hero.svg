<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="t d">
  <title id="t">Football data pipeline — Data Engineering</title>
  <desc id="d">Five football data sources flow through a fetch layer, then player matching and cleaning, into one Supabase database. The site, an MCP server and a file bucket read from it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9b9b9b"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dd0077"/>
    </marker>
    <style>
      .sans { font-family: Geist, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="760" height="530" fill="#fafafa"/>

  <!-- heading -->
  <text x="48" y="70" class="mono" font-size="19" letter-spacing="3" fill="#dd0077">DATA ENGINEERING</text>
  <text x="48" y="120" class="sans" font-size="44" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">Football data pipeline</text>
  <text x="48" y="156" class="sans" font-size="19" fill="#5c5c5c">Five sources, one source of truth</text>

  <!-- sources -->
  <g class="mono" font-size="13" fill="#1a1a1a" text-anchor="middle">
    <rect x="48" y="232" width="140" height="32" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="118" y="253">FBref</text>
    <rect x="48" y="272" width="140" height="32" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="118" y="293">Transfermarkt</text>
    <rect x="48" y="312" width="140" height="32" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="118" y="333">Understat</text>
    <rect x="48" y="352" width="140" height="32" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="118" y="373">Results · Elo</text>
    <rect x="48" y="392" width="140" height="32" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="118" y="413">Match events</text>
  </g>
  <text x="118" y="452" class="mono" font-size="14" fill="#6b6b6b" text-anchor="middle">5 sources</text>

  <!-- converge into fetch -->
  <g fill="none" stroke="#9b9b9b" stroke-width="2.5">
    <path d="M188 248 C 206 248, 206 322, 222 322"/>
    <path d="M188 288 C 206 288, 206 322, 222 322"/>
    <path d="M188 328 L 222 322"/>
    <path d="M188 368 C 206 368, 206 322, 222 322"/>
    <path d="M188 408 C 206 408, 206 322, 222 322" marker-end="url(#arrow)"/>
  </g>

  <!-- fetch -->
  <rect x="226" y="262" width="122" height="120" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="287" y="296" class="sans" font-size="19" font-weight="600" fill="#1a1a1a" text-anchor="middle">Fetch</text>
  <line x1="246" y1="310" x2="328" y2="310" stroke="#ebebeb" stroke-width="2"/>
  <g class="mono" font-size="13" fill="#6b6b6b" text-anchor="middle">
    <text x="287" y="332">readers</text>
    <text x="287" y="350">cache</text>
    <text x="287" y="368">manifest</text>
  </g>

  <line x1="348" y1="322" x2="368" y2="322" stroke="#9b9b9b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- match & clean -->
  <rect x="374" y="262" width="122" height="120" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="435" y="296" class="sans" font-size="19" font-weight="600" fill="#1a1a1a" text-anchor="middle">Match</text>
  <line x1="394" y1="310" x2="476" y2="310" stroke="#ebebeb" stroke-width="2"/>
  <g class="mono" font-size="13" fill="#6b6b6b" text-anchor="middle">
    <text x="435" y="332">one player,</text>
    <text x="435" y="350">many names</text>
    <text x="435" y="368">+ clean</text>
  </g>

  <line x1="496" y1="322" x2="516" y2="322" stroke="#dd0077" stroke-width="2.5" marker-end="url(#arrowPink)"/>

  <!-- database -->
  <rect x="522" y="262" width="110" height="120" rx="10" fill="#fdf4f9" stroke="#dd0077" stroke-width="2.5"/>
  <text x="577" y="296" class="sans" font-size="19" font-weight="600" fill="#1a1a1a" text-anchor="middle">Supabase</text>
  <line x1="540" y1="310" x2="614" y2="310" stroke="#f3d6e7" stroke-width="2"/>
  <g class="mono" font-size="13" fill="#6b6b6b" text-anchor="middle">
    <text x="577" y="332">8 tables</text>
    <text x="577" y="350">~50k player-</text>
    <text x="577" y="368">seasons</text>
  </g>

  <!-- fan out to readers -->
  <g fill="none" stroke="#9b9b9b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M632 300 C 644 300, 644 262, 652 262"/>
    <path d="M632 322 L 652 322"/>
    <path d="M632 344 C 644 344, 644 382, 652 382"/>
  </g>
  <g class="sans" font-size="15" font-weight="600" fill="#1a1a1a" text-anchor="middle">
    <rect x="656" y="244" width="76" height="36" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="694" y="267">Site</text>
    <rect x="656" y="304" width="76" height="36" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="694" y="327">MCP</text>
    <rect x="656" y="364" width="76" height="36" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <text x="694" y="387">Files</text>
  </g>
  <text x="694" y="428" class="mono" font-size="14" fill="#6b6b6b" text-anchor="middle">read-only</text>

  <!-- footer -->
  <line x1="48" y1="476" x2="712" y2="476" stroke="#ebebeb" stroke-width="2"/>
  <text x="48" y="504" class="mono" font-size="14" fill="#6b6b6b">Big 5 leagues · 18 seasons · refreshed weekly</text>
</svg>
