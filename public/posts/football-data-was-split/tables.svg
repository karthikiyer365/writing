<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="t d">
  <title id="t">How the eight tables connect</title>
  <desc id="d">player_xref decides each player's Transfermarkt id and feeds player_season. player_season links to transfers by tm_id, to shots_understat by its Understat id, and feeds the derived age_curve table. shots_understat links to team_match_understat by game_id. matches and club_elo share only a club name, and the two sources spell clubs differently.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9b9b9b"/>
    </marker>
    <style>
      .name { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .rows { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #dd0077; }
      .grain { font-family: Geist, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1a1a1a; }
      .key { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #6b6b6b; }
      .edge { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #5c5c5c; }
      .box { fill: #ffffff; stroke: #c9c9c9; stroke-width: 2; }
      .flow { stroke: #9b9b9b; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="760" height="640" fill="#fafafa"/>

  <!-- column labels -->
  <g font-family="Geist Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#dd0077">
    <text x="30" y="40">PLAYERS · PRICE</text>
    <text x="520" y="40">SHOTS · xG</text>
    <text x="300" y="440">CLUBS · MATCHES</text>
  </g>

  <!-- player_xref -->
  <rect x="30" y="56" width="240" height="104" rx="8" class="box"/>
  <text x="46" y="82" class="name">player_xref</text>
  <text x="254" y="82" class="rows" text-anchor="end">~51k</text>
  <text x="46" y="104" class="grain">one matching decision</text>
  <text x="46" y="126" class="key">key: league · season ·</text>
  <text x="46" y="142" class="key">     team · fbref_name</text>

  <!-- player_season (hub) -->
  <rect x="30" y="220" width="240" height="152" rx="8" fill="#fdf4f9" stroke="#dd0077" stroke-width="2.5"/>
  <text x="46" y="246" class="name">player_season</text>
  <text x="254" y="246" class="rows" text-anchor="end">~50k</text>
  <text x="46" y="268" class="grain">a player's season at one club</text>
  <text x="46" y="290" class="key">key: league · season ·</text>
  <text x="46" y="306" class="key">     team · player_name</text>
  <text x="46" y="332" class="key">+ tm_id · understat_id</text>
  <text x="46" y="352" class="grain">stats + price + xG in one row</text>

  <!-- transfers -->
  <rect x="30" y="470" width="240" height="104" rx="8" class="box"/>
  <text x="46" y="496" class="name">transfers</text>
  <text x="254" y="496" class="rows" text-anchor="end">~175k</text>
  <text x="46" y="518" class="grain">one move between clubs</text>
  <text x="46" y="540" class="key">key: tm_id · transfer_date</text>

  <!-- age_curve -->
  <rect x="300" y="300" width="190" height="92" rx="8" class="box" stroke-dasharray="6 5"/>
  <text x="316" y="326" class="name">age_curve</text>
  <text x="474" y="326" class="rows" text-anchor="end">76</text>
  <text x="316" y="348" class="grain">value by position + age</text>
  <text x="316" y="370" class="key">key: position · age</text>

  <!-- team_match_understat -->
  <rect x="520" y="56" width="210" height="104" rx="8" class="box"/>
  <text x="536" y="82" class="name">team_match_understat</text>
  <text x="714" y="104" class="rows" text-anchor="end">~22k</text>
  <text x="536" y="104" class="grain">one match's xG</text>
  <text x="536" y="126" class="key">key: league · season ·</text>
  <text x="536" y="142" class="key">     game_id</text>

  <!-- shots_understat -->
  <rect x="520" y="220" width="210" height="104" rx="8" class="box"/>
  <text x="536" y="246" class="name">shots_understat</text>
  <text x="714" y="246" class="rows" text-anchor="end">~550k</text>
  <text x="536" y="268" class="grain">one shot</text>
  <text x="536" y="290" class="key">key: league · season ·</text>
  <text x="536" y="306" class="key">     shot_id</text>

  <!-- matches -->
  <rect x="300" y="456" width="190" height="118" rx="8" class="box"/>
  <text x="316" y="482" class="name">matches</text>
  <text x="474" y="482" class="rows" text-anchor="end">~33k</text>
  <text x="316" y="504" class="grain">one result</text>
  <text x="316" y="526" class="key">key: league · season ·</text>
  <text x="316" y="542" class="key">     date · home · away</text>

  <!-- club_elo -->
  <rect x="520" y="456" width="210" height="118" rx="8" class="box"/>
  <text x="536" y="482" class="name">club_elo</text>
  <text x="714" y="482" class="rows" text-anchor="end">~190k</text>
  <text x="536" y="504" class="grain">a club's rating on a date</text>
  <text x="536" y="526" class="key">key: team · league ·</text>
  <text x="536" y="542" class="key">     snapshot_date</text>

  <!-- edges -->
  <line x1="150" y1="160" x2="150" y2="214" class="flow" marker-end="url(#arrow)"/>
  <text x="162" y="192" class="edge">decides tm_id</text>

  <line x1="150" y1="372" x2="150" y2="464" class="flow" marker-end="url(#arrow)"/>
  <text x="162" y="422" class="edge">tm_id</text>

  <path d="M270 346 L 294 346" class="flow" marker-end="url(#arrow)"/>
  <text x="300" y="414" class="edge">derived, not fetched</text>

  <path d="M270 262 L 514 262" class="flow" marker-end="url(#arrow)"/>
  <text x="290" y="252" class="edge">understat_id → player_id</text>

  <line x1="625" y1="220" x2="625" y2="166" class="flow" marker-end="url(#arrow)"/>
  <text x="637" y="198" class="edge">game_id</text>

  <line x1="490" y1="515" x2="520" y2="515" stroke="#dd0077" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="300" y="604" class="edge">matches ↔ club_elo share only a club name,</text>
  <text x="300" y="622" class="edge">and the sources spell it differently</text>
</svg>
